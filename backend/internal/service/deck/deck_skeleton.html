{{/* deck 统一骨架模板。只有两处占位：{{.Title}} 和 {{.Sections}}，
     其余内容属于第①层（框架）与第②层（组件库引用），LLM 永远不可见不可改。
     使用 Go 的 text/template 渲染；Title 必须先做 HTML 转义再传入，
     Sections 是受信任的内部生成的 HTML，原样插入。 */}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{.Title}}</title>
  <!-- 第①层：框架与主题（LLM 不可见不可改） -->
  <link rel="stylesheet" href="/assets/reveal.css">
  <link rel="stylesheet" href="/assets/moon.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <!-- 第②层：组件库（LLM 只可使用 class，不可修改定义） -->
  <link rel="stylesheet" href="/assets/components.css">
  <!-- 主题配置：JSON 是 update_theme 的操作真身；override 块由后端渲染，
       必须位于所有 <link> 之后（级联覆盖 theme.css 的默认值）。
       默认值与 theme.css 的 :root 保持一致，改默认主题两处一起改 -->
  <script type="application/json" id="deck-theme">{"accent":"#5eead4","background":"#0b132b","heading_color":"#5eead4","text_color":"#e2e8f0","font":"sans","radius":"10px","transition":"slide"}</script>
  <style id="deck-theme-override"></style>
  <!-- 第②.5层：deck 自定义样式槽（由 update_custom_css 整体替换，级联在组件库之后）。
       老 deck 没有这个块，读写路径上会按需补出来，见 ensureCustomCSSBlock -->
  <style id="deck-custom"></style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!-- ============ AGENT-EDITABLE-START（第③层：LLM 唯一可写区域） ============ -->
{{.Sections}}
      <!-- ============ AGENT-EDITABLE-END ============ -->
    </div>
  </div>
  <script src="/assets/reveal.js"></script>
  <script src="/assets/init.js"></script>
</body>
</html>
