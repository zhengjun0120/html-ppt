<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SSE 接口测试台</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b132b; color: #e2e8f0;
      display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 8px 16px; border-bottom: 1px solid #1e2a45; font-size: 13px;
             display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    header b { color: #5eead4; }
    header .lbl { color: #64748b; }
    select, header button {
      background: #1a2338; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 4px 8px; font-size: 13px; outline: none;
    }
    header button { cursor: pointer; }
    header button:hover { border-color: #5eead4; }
    #who { color: #5eead4; }
    main { flex: 1; display: flex; min-height: 0; }   /* min-height:0 让内层滚动生效 */
    #chatPane { flex: 1 1 56%; display: flex; flex-direction: column; min-width: 0; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble {
      max-width: 85%; padding: 10px 14px; border-radius: 10px;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .user      { align-self: flex-end; background: #1d4ed8; }
    .delta     { align-self: flex-start; background: #1a2338; }
    /* 思考内容：装进 <details>。闭合时子树不参与布局——推理链再长也不产生排版开销，
       展开时才按节流把正文写进 DOM（见 JS 的 flushStream） */
    details.think { align-self: flex-start; background: transparent; color: #64748b;
                    font-size: 12px; border-left: 2px solid #334155; padding-left: 10px;
                    max-width: 95%; }
    details.think > summary { cursor: pointer; outline: none; }
    details.think > summary:hover { color: #94a3b8; }
    details.think .tbody { white-space: pre-wrap; word-break: break-word;
                           max-height: 320px; overflow-y: auto; margin-top: 4px; }
    /* 工具参数 / 子模型输出的流式盒子：同 think 的折叠思路，闭合时正文不参与布局。
       参数盒（JSON 碎片）默认折叠只看字数；子模型盒（审查报告）默认展开边跑边读 */
    details.streambox { align-self: flex-start; background: transparent; color: #64748b;
                        font-size: 12px; border-left: 2px solid #134e4a; padding-left: 10px;
                        max-width: 95%; }
    details.streambox > summary { cursor: pointer; outline: none; }
    details.streambox > summary:hover { color: #94a3b8; }
    details.streambox .sbody { white-space: pre-wrap; word-break: break-word;
                               max-height: 320px; overflow-y: auto; margin-top: 4px;
                               font-family: ui-monospace, Consolas, monospace; font-size: 11px;
                               color: #94a3b8; }
    /* 渲染上限提示：超长产出只计数不写 DOM */
    .capnote { color: #475569; font-size: 11px; margin-top: 6px; }
    .tool      { align-self: flex-start; background: #134e4a; font-size: 13px; max-width: 95%; }
    .tool pre  { margin-top: 6px; font-size: 11px; color: #99f6e4; max-height: 120px; overflow: auto; }
    .toolerr   { align-self: flex-start; background: #7f1d1d; font-size: 13px; max-width: 95%; }
    .syserr    { align-self: center; background: #450a0a; color: #fca5a5; font-size: 13px; }
    .done      { align-self: center; background: #052e16; color: #86efac; font-size: 12px; }
    .sys       { align-self: center; color: #64748b; font-size: 12px; }
    /* 观测事件：比对话本身低一级的视觉权重，不抢主线阅读 */
    .trace     { align-self: flex-start; background: #1e1b3a; color: #c4b5fd;
                 font-size: 12px; max-width: 95%; font-family: ui-monospace, Consolas, monospace; }
    .session   { align-self: center; color: #475569; font-size: 11px; }
    footer { padding: 12px 16px; border-top: 1px solid #1e2a45; display: flex; gap: 8px; }
    textarea {
      flex: 1; resize: none; height: 44px; border-radius: 8px; border: 1px solid #334155;
      background: #1a2338; color: #e2e8f0; padding: 10px 12px; font-size: 14px; outline: none;
    }
    button {
      border: 0; border-radius: 8px; padding: 0 18px; font-size: 14px; cursor: pointer; font-weight: 600;
    }
    #send { background: #5eead4; color: #0b132b; }
    #send:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    #abort { background: #7f1d1d; color: #fca5a5; display: none; }
    label { align-self: center; font-size: 12px; color: #64748b; cursor: pointer; }
    /* 右侧预览栏：沙箱 iframe，安全模型的前端半边 */
    #previewPane { flex: 1 1 44%; display: flex; flex-direction: column;
                   border-left: 1px solid #1e2a45; min-width: 320px; }
    .pvbar { padding: 8px 16px; border-bottom: 1px solid #1e2a45; font-size: 12px;
             display: flex; align-items: center; gap: 10px; }
    .pvbar button { background: #1a2338; color: #e2e8f0; border: 1px solid #334155;
                    border-radius: 6px; padding: 2px 8px; font-weight: 400; }
    .pvbar button:hover { border-color: #5eead4; }
    #previewFrame { flex: 1; width: 100%; border: 0; background: #0b132b; }
    /* 全屏预览遮罩：盖住整页看排版效果，iframe 与右侧预览同款沙箱配置 */
    #fsMask { position: fixed; inset: 0; background: #0b132b; display: none;
              flex-direction: column; z-index: 20; }
    #fsMask .fsbar { padding: 6px 14px; border-bottom: 1px solid #1e2a45; font-size: 12px;
                     display: flex; align-items: center; gap: 10px; }
    #fsMask button { background: #1a2338; color: #e2e8f0; border: 1px solid #334155;
                     border-radius: 6px; padding: 2px 10px; font-size: 12px; font-weight: 400;
                     cursor: pointer; }
    #fsMask button:hover { border-color: #5eead4; }
    #fsFrame { flex: 1; width: 100%; border: 0; background: #0b132b; }
    /* 版本历史面板：折叠在预览栏下方，用于测试版本控制 REST 接口 */
    #histPanel { display: none; max-height: 42%; overflow-y: auto;
                 border-bottom: 1px solid #1e2a45; background: #0d1730; }
    #histPanel.open { display: block; }
    .hist-row { display: flex; align-items: center; gap: 8px; padding: 5px 16px;
                border-bottom: 1px solid #16223c; font-size: 12px; }
    .hist-row:hover { background: #101c36; }
    .hist-row .v  { color: #5eead4; font-family: Consolas, monospace; }
    .hist-row .t  { color: #64748b; white-space: nowrap; }
    .hist-row .op { color: #94a3b8; }
    .hist-row .dt { color: #cbd5e1; flex: 1; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .hist-row .pg { color: #475569; white-space: nowrap; }
    .hist-row button { background: #1a2338; color: #e2e8f0; border: 1px solid #334155;
                       border-radius: 5px; padding: 1px 7px; font-size: 11px;
                       font-weight: 400; cursor: pointer; }
    .hist-row button:hover { border-color: #5eead4; }
    .hist-row button.danger:hover { border-color: #fca5a5; color: #fca5a5; }
    .hist-row.restore-op .op { color: #fbbf24; }   /* 恢复类版本高亮，便于辨认可撤销点 */
    #histMsg { color: #64748b; }
    /* ask_user 提问卡片 */
    .ask { align-self: flex-start; background: #3b2f0b; border: 1px solid #a16207;
           max-width: 95%; font-size: 13px; }
    .ask .q { margin-top: 8px; }
    .ask .q .rec { color: #fbbf24; font-size: 12px; }
    .ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .ask .opts button { background: #1a2338; color: #e2e8f0; border: 1px solid #334155;
                        border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 400; }
    .ask .opts button:first-child { border-color: #fbbf24; color: #fbbf24; } /* 契约：第一个选项 = 推荐答案 */
    .ask input { width: 100%; background: #1a2338; border: 1px solid #334155; border-radius: 6px;
                 color: #e2e8f0; padding: 6px 10px; font-size: 13px; outline: none; }
    .ask .acts { display: flex; gap: 8px; margin-top: 8px; }
    .ask .acts button { padding: 4px 14px; font-size: 12px; }
    .ask .submit { background: #fbbf24; color: #0b132b; }
    .ask .skip  { background: #1a2338; color: #94a3b8; font-weight: 400; }
    /* 登录/注册遮罩 */
    #authMask { position: fixed; inset: 0; background: rgba(2,6,23,.82);
                display: none; align-items: center; justify-content: center; z-index: 30; }
                /* z-index 高于全屏预览遮罩：会话过期弹登录时要能盖住它 */
    #authCard { background: #101a30; border: 1px solid #334155; border-radius: 12px;
                padding: 28px; width: 340px; display: flex; flex-direction: column; gap: 10px; }
    #authCard h2 { color: #5eead4; font-size: 18px; margin-bottom: 4px; }
    #authCard .tabs { display: flex; gap: 6px; }
    #authCard .tabs button { flex: 1; background: #1a2338; color: #64748b; padding: 6px 0; font-weight: 400; }
    #authCard .tabs button.on { color: #5eead4; border: 1px solid #5eead4; }
    #authCard input { background: #1a2338; border: 1px solid #334155; border-radius: 8px;
                      color: #e2e8f0; padding: 9px 12px; font-size: 14px; outline: none; width: 100%; }
    #authCard .row { display: flex; gap: 8px; }
    #authCard .row input { flex: 1; }
    #aSendCode { background: #1a2338; color: #99f6e4; border: 1px solid #334155;
                 padding: 0 12px; font-size: 12px; font-weight: 400; white-space: nowrap; }
    #aSubmit { background: #5eead4; color: #0b132b; padding: 9px 0; }
    #aMsg { font-size: 12px; color: #fca5a5; min-height: 16px; }
  </style>
</head>
<body>
  <header>
    <span><b>SSE 测试台</b></span>
    <span class="lbl">会话</span>
    <span id="sessTag" class="lbl">（新对话）</span>
    <button id="newChat" title="丢弃当前会话，开始新对话">新对话</button>
    <span class="lbl">工作对象</span>
    <select id="deck"><option value="">（不指定）</option></select>
    <button id="reload" title="刷新列表">↻</button>
    <button id="preview" title="在新标签页打开所选 deck（无沙箱，用于对比测试）">预览↗</button>
    <span class="lbl" id="deckInfo"></span>
    <span style="flex:1"></span>
    <span class="lbl">当前用户</span>
    <span id="who">…</span>
    <button id="apiKeyBtn" title="设置你自己的 LLM API Key（留空清除，用服务器默认）">API Key</button>
    <button id="logout">退出</button>
  </header>
  <main>
    <section id="chatPane">
      <div id="log"></div>
      <footer>
        <textarea id="input" placeholder="例如：帮我做一份介绍 Go 并发的 PPT（Ctrl+Enter 发送）"></textarea>
        <button id="send">发送</button>
        <button id="abort">中断</button>
        <label><input type="checkbox" id="raw"> 原始帧</label>
        <label title="把 agent 的执行过程（工具参数、返回耗时、联网搜了什么、视觉审查截图）也显示在对话里。完整记录见 /trace">
          <input type="checkbox" id="traceChk"> 观测事件</label>
        <a href="/trace" target="_blank" title="观测台：每轮完整上下文、工具参数、截图、分项 token"
           style="color:#a78bfa;font-size:12px;align-self:center">观测台↗</a>
      </footer>
    </section>
    <section id="previewPane">
      <div class="pvbar">
        <span class="lbl">预览（沙箱 iframe）</span>
        <span class="lbl" id="pvId">未选择 deck</span>
        <button id="pvRefresh" title="重新加载预览（会回到第一页）">↻</button>
        <button id="pvFullscreen" title="全屏预览当前 deck">⛶ 全屏</button>
        <button id="pvNewTab" title="在新标签页打开当前 deck">↗ 新标签页</button>
      </div>
      <!-- 版本历史：run 结束后自动记档，这里直接操作 REST 接口做端到端测试 -->
      <div class="pvbar">
        <span class="lbl">历史</span>
        <span class="lbl" id="histCount">—</span>
        <button id="histToggle" title="展开/收起版本列表">展开</button>
        <button id="histReload" title="重新拉取历史列表">↻</button>
        <button id="histClear" title="清空该 deck 的全部历史（不影响当前内容）">清空</button>
        <span class="lbl" id="histMsg"></span>
      </div>
      <div id="histPanel">
        <div id="histList"></div>
      </div>
      <!-- 不给 allow-same-origin：iframe 内变成不透明 origin，
           脚本碰不到本页 DOM/cookie/localStorage；配合后端 CSP 形成完整沙箱 -->
      <iframe id="previewFrame" sandbox="allow-scripts allow-popups allow-forms"></iframe>
    </section>
  </main>

  <!-- 全屏预览遮罩：盖住整页看真实放映效果；iframe 与右侧预览同款沙箱 -->
  <div id="fsMask">
    <div class="fsbar">
      <span class="lbl" id="fsId">未选择 deck</span>
      <span style="flex:1"></span>
      <button id="fsFull" title="调用浏览器真全屏（Esc 先退真全屏，再按一次 Esc 关闭预览）">真全屏</button>
      <button id="fsNewTab" title="在新标签页打开">新标签页↗</button>
      <button id="fsClose" title="关闭全屏预览（Esc）">×</button>
    </div>
    <iframe id="fsFrame" sandbox="allow-scripts allow-popups allow-forms" title="全屏预览"></iframe>
  </div>

  <!-- 登录/注册遮罩：无 token 或 401 时显示 -->
  <div id="authMask">
    <div id="authCard">
      <h2>html-ppt</h2>
      <div class="tabs">
        <button id="tabLogin" class="on">登录</button>
        <button id="tabReg">注册</button>
      </div>
      <input id="aEmail" placeholder="邮箱" autocomplete="username">
      <div class="row" id="codeRow" style="display:none">
        <input id="aCode" placeholder="邮箱验证码">
        <button id="aSendCode">获取验证码</button>
      </div>
      <input id="aPassword" type="password" placeholder="密码（8~72 位）" autocomplete="current-password">
      <button id="aSubmit">登录</button>
      <div id="aMsg"></div>
    </div>
  </div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const abortBtn = document.getElementById('abort');
const rawChk = document.getElementById('raw');
const traceChk = document.getElementById('traceChk');   // 观测事件默认关：它比对话本身吵得多
const deckSel = document.getElementById('deck');
const deckInfo = document.getElementById('deckInfo');
const previewFrame = document.getElementById('previewFrame');
const pvId = document.getElementById('pvId');
const who = document.getElementById('who');
const authMask = document.getElementById('authMask');
const sessTag = document.getElementById('sessTag');

const TOKEN_KEY = 'hpt_token';
const SESSION_KEY = 'hpt_session';   // 会话 id 持久化：刷新页面可续聊，ask_user 暂停态也不怕刷新
let streaming = false;
let controller = null;
// 流式渲染状态集中在 stream 对象里（见"流式渲染"一节），这里不再单独持有 delta/think 节点

const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = t => t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY);
const getSession = () => parseInt(localStorage.getItem(SESSION_KEY) || '0', 10) || 0;
const setSession = id => id > 0 ? localStorage.setItem(SESSION_KEY, String(id)) : localStorage.removeItem(SESSION_KEY);

// 自动滚动改为"粘底"：用户上滚查看历史时不再被抢滚动，
// 且只在 flush 时读一次 scrollHeight（读它会强制重排）
let stickyBottom = true;
log.addEventListener('scroll', () => {
  stickyBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
}, { passive: true });

const scroll = () => { if (stickyBottom) log.scrollTop = log.scrollHeight; };

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  log.appendChild(d);
  scroll();
  return d;
}

// ---------- 流式渲染：抗高速 token 与超长思考 ----------
// 模型 token 流速可以远超屏幕刷新率，推理链还可能极长。三条措施：
//   1) rAF 合并：收到的内容先进缓冲，每帧最多写一次 DOM（原实现是每个 SSE 帧写一次）
//   2) 文本节点 appendData 追加增量，替代 el.textContent +=
//      （后者每次替换全部子节点、重建整段文本，长文下累计是 O(n²)）
//   3) 思考内容装进闭合的 <details>：子树不参与布局，推理再长也不产生排版开销；
//      展开时才按 THINK_MS 节流写入正文
const RENDER_CAP = 20000;   // 单个气泡最多渲染的字数，超出只计数不写 DOM
const THINK_MS = 200;       // 思考正文展开时的写入节流间隔

const stream = {
  dEl: null, dNode: null, dShown: 0, bufD: '',
  tEl: null, tNode: null, tCnt: null, tShown: 0, tTotal: 0, bufT: '', tOpen: false, tLast: 0,
  rawEl: null, rawNode: null, rawShown: 0, bufRaw: '',
  tools: new Map(),   // 主模型正在生成的工具调用参数盒（key: 'i'+tool_index）
  subs: new Map(),    // 工具执行期子模型输出盒（key: tool_call_id，无则 tool_name）
  scheduled: false,
};

function resetBubbles() {
  stream.dEl = stream.dNode = null; stream.dShown = 0; stream.bufD = '';
  stream.tEl = stream.tNode = stream.tCnt = null;
  stream.tShown = stream.tTotal = 0; stream.bufT = ''; stream.tOpen = false; stream.tLast = 0;
  stream.rawEl = stream.rawNode = null; stream.rawShown = 0; stream.bufRaw = '';
  // 上一轮的盒子 DOM 留在日志里当记录，这里只清引用：下一轮同名工具拿的是新盒子
  stream.tools.clear(); stream.subs.clear();
  stream.scheduled = false;
}

// ---------- 提问待答状态 ----------
// agent 在 ask_user 处暂停时，消息数组结尾是一条**悬空的 tool_calls**（ask_user 的
// 应答要等用户回答才补上）。此时后端只接受"回答"：直接发新消息会被闸门拦下，
// 因为那会破坏 "tool_calls 后面必须紧跟 tool 消息" 这条协议不变式（API 直接 400，
// 而且坏形状会被持久化、把这个会话永久弄坏）。
//
// 所以这里把入口锁上，别让用户白点一次。
let pendingAsk = false;

function setPendingAsk(on) {
  pendingAsk = on;
  input.disabled = on;
  sendBtn.disabled = on;
  input.placeholder = on
    ? '请先回答上面的提问（或点右上角「新对话」重新开始）'
    : '例如：帮我做一份介绍 Go 并发的 PPT（Ctrl+Enter 发送）';
}

// restorePendingAsk 页面刷新后把丢掉的提问卡片重建出来。
// 没有它的话，刷新一次这个会话就永远答不上了：卡片没了（不知道问的是什么），
// 新消息又被闸门拦着——用户只能把整个会话弃掉。
async function restorePendingAsk(sid) {
  let data;
  try {
    const resp = await api('/api/chat/pending?session_id=' + sid);
    if (!resp.ok) return;
    data = await resp.json();
  } catch { return; }
  if (!data.questions) return;
  let qs = [];
  try { qs = JSON.parse(data.questions).questions || []; } catch { return; }
  if (!qs.length) return;
  bubble('sys', '⚠️ 这个会话有一条待回答的提问（刷新前的卡片已恢复）');
  renderAskCard(qs);
}

function onDelta(chunk) { stream.bufD += chunk; scheduleFlush(); }
function onThink(chunk) {
  stream.bufT += chunk;
  stream.tTotal += chunk.length;   // 计数按"已收到"算，和渲染上限无关
  scheduleFlush();
}
function onRaw(frame) { stream.bufRaw += frame.replaceAll('\n', ' ⏎ ') + '\n'; scheduleFlush(); }

// ---------- 工具参数 / 子模型输出的流式盒子 ----------
// tool_start/tool_delta 是主模型正在生成的工具调用参数（arguments 的 JSON 原文片段，
// 单片段不是合法 JSON——只透传与计数，不解析）；sub_delta 是工具执行期间子模型
// （视觉审查）流式吐出的报告原文。两类都并进 flushStream 的 rAF 合并通道：
// 参数盒默认折叠（碎片没有阅读价值，看字数即可），子模型盒默认展开——审查报告是
// 给人看的，而看图审查是整个流程最长的静默窗口，展开着正好把这段空白填上。
// 盒子 key 用 'i'+tool_index（后端 tool_delta 只带 index 不带 id），收尾即从 Map
// 删除：下一轮再调同名工具时拿到的是新盒子，而不是已定格的旧盒。
function boxKey(ev) { return 'i' + (ev.tool_index ?? 0); }

function ensureBox(map, key, name, title, open) {
  let b = map.get(key);
  if (b) return b;
  const el = document.createElement('details');
  el.className = 'streambox';
  el.open = open;
  const sum = document.createElement('summary');
  sum.textContent = title + ' 0 字…';
  const body = document.createElement('div');
  body.className = 'sbody';
  const node = document.createTextNode('');
  body.appendChild(node);
  el.append(sum, body);
  log.appendChild(el);
  scroll();
  b = { el, sum, body, node, buf: '', shown: 0, total: 0, name, id: null, title, sealed: false, capped: false };
  map.set(key, b);
  return b;
}

function flushBoxBuf(b) {
  if (!b.buf) return false;
  b.shown = appendChunk(b.node, b.buf, b.shown);
  b.buf = '';
  // capnote 只补一次：后续每帧都到上限，反复插会刷出一排提示
  if (b.shown >= RENDER_CAP && !b.capped) { b.capped = true; capNote(b.el); }
  if (b.el.open) b.body.scrollTop = b.body.scrollHeight;   // 展开中：跟住最新输出
  return true;
}

function feedBox(map, key, name, title, chunk, open) {
  if (!chunk) return null;
  const b = ensureBox(map, key, name, title, open);
  if (b.sealed) return b;                     // 收尾后迟到的增量不再写
  b.buf += chunk;
  b.total += chunk.length;
  scheduleFlush();
  return b;
}

// sealBoxes 把匹配的盒子定格（name 传 '' 收尾全部）并从 Map 删除，DOM 气泡留在日志里当记录。
// 事件和盒子都带 tool_call_id 时按 id 精确归属（同名并行调用不会错位）；任一方缺 id
// 就退回按名字——工具是逐个执行的，"当前唯一未定格的同名盒"在实际时序下不会错位。
function sealBoxes(map, name, suffix, id) {
  for (const [k, b] of map) {
    if (b.sealed) continue;
    const byId = id && b.id;                  // 两边都带 id 才按 id 匹配
    if (byId ? b.id !== id : (name && b.name !== name)) continue;
    b.sealed = true;
    b.el.open = false;                      // 展开中的子模型盒收回去：完整结果马上由结果气泡给出
    flushBoxBuf(b);
    b.sum.textContent = b.title + ' · ' + b.total + ' 字' + suffix;
    map.delete(k);
  }
}
const sealAll = suffix => { sealBoxes(stream.tools, '', suffix); sealBoxes(stream.subs, '', suffix); };

function onToolStart(ev) {
  const b = ensureBox(stream.tools, boxKey(ev), ev.tool_name ?? '',
                      '🛠 ' + (ev.tool_name ?? '?') + ' · 参数生成中', false);
  b.name = ev.tool_name ?? '';
  b.id = ev.tool_call_id ?? null;   // 收尾时按 id 精确归属（参数盒 key 仍用 index：delta 不带 id）
  scroll();
}
function onToolDelta(ev) {
  feedBox(stream.tools, boxKey(ev), '', '🛠 工具 · 参数生成中', ev.content ?? '', false);
}
function onSubDelta(ev) {
  // 有 tool_call_id 按它开盒（后端在 execTool 统一注入）；没带就退回按工具名
  const id = ev.tool_call_id || null;
  const b = feedBox(stream.subs, id || ev.tool_name || 'sub', ev.tool_name ?? '',
                    '👁 ' + (ev.tool_name ?? '子调用') + ' · 子模型输出中', ev.content ?? '', true);
  if (b) b.id = id;
}

function scheduleFlush() {
  if (stream.scheduled) return;
  stream.scheduled = true;
  requestAnimationFrame(flushStream);
}

// appendChunk 只往一个文本节点追加增量；到上限后不再写 DOM，仅由调用方补提示
function appendChunk(node, chunk, shown) {
  if (shown >= RENDER_CAP) return shown;
  const part = chunk.slice(0, RENDER_CAP - shown);
  node.appendData(part);
  return shown + part.length;
}

function capNote(el) {
  const d = document.createElement('div');
  d.className = 'capnote';
  d.textContent = '… 已达 ' + RENDER_CAP + ' 字渲染上限，后续增量不再显示（完整文本仍在会话上下文里）';
  el.appendChild(d);
}

function ensureThinkEl() {
  const el = document.createElement('details');
  el.className = 'bubble think';
  const sum = document.createElement('summary');
  sum.textContent = '💭 思考中… 0 字';
  const body = document.createElement('div');
  body.className = 'tbody';
  const node = document.createTextNode('');
  body.appendChild(node);
  el.append(sum, body);
  el.addEventListener('toggle', () => { stream.tOpen = el.open; });
  log.appendChild(el);
  scroll();
  stream.tEl = el; stream.tCnt = sum; stream.tNode = node;
}

function flushStream() {
  stream.scheduled = false;

  // 正文：每帧写一次
  if (stream.bufD) {
    if (!stream.dEl) {
      stream.dEl = bubble('delta', '');
      stream.dNode = document.createTextNode('');
      stream.dEl.appendChild(stream.dNode);
    }
    stream.dShown = appendChunk(stream.dNode, stream.bufD, stream.dShown);
    stream.bufD = '';
    if (stream.dShown >= RENDER_CAP) capNote(stream.dEl);
  }

  // 思考：标题计数跟手更新；正文折叠时不写（无布局成本），展开时按 THINK_MS 节流
  if (stream.tTotal > 0) {
    if (!stream.tEl) ensureThinkEl();
    if (stream.bufT) {
      const now = performance.now();
      if (!stream.tOpen || now - stream.tLast >= THINK_MS) {
        stream.tLast = now;
        stream.tShown = appendChunk(stream.tNode, stream.bufT, stream.tShown);
        stream.bufT = '';
      }
    }
    stream.tCnt.textContent = '💭 思考中… ' + stream.tTotal + ' 字';
  }

  // 原始帧（调试开关）：合并进单个气泡，避免高速流下每秒新建几十个节点
  if (stream.bufRaw) {
    if (!stream.rawEl) {
      stream.rawEl = bubble('sys', 'RAW ← ');
      stream.rawNode = document.createTextNode('');
      stream.rawEl.appendChild(stream.rawNode);
    }
    stream.rawShown = appendChunk(stream.rawNode, stream.bufRaw, stream.rawShown);
    stream.bufRaw = '';
    if (stream.rawShown >= RENDER_CAP) capNote(stream.rawEl);
  }

  // 工具参数 / 子模型输出：与正文同一条 rAF 通道，每帧最多写一次 DOM
  for (const b of stream.tools.values()) {
    if (flushBoxBuf(b)) b.sum.textContent = b.title + ' ' + b.total + ' 字…';
  }
  for (const b of stream.subs.values()) {
    if (flushBoxBuf(b)) b.sum.textContent = b.title + ' ' + b.total + ' 字…';
  }

  scroll();
}

// 一轮结束：把缓冲写尽，思考标题从"思考中"改成"已思考"
function finishStream() {
  flushStream();
  if (stream.tEl) {
    stream.tCnt.textContent = '💭 已思考 ' + stream.tTotal + ' 字（点击展开）';
  }
  sealAll(' · 已结束');   // done 是流的真实终点：所有流式盒子在此定格
  scroll();
}

// ---------- 统一 API 封装：自动带 Authorization，401 弹回登录 ----------
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body) headers['Content-Type'] = 'application/json';
  const t = getToken();
  if (t) headers['Authorization'] = 'Bearer ' + t;
  const resp = await fetch(path, Object.assign({}, opts, { headers }));
  if (resp.status === 401) {
    setToken('');
    showAuth('登录已过期，请重新登录');
    throw new Error('未登录');
  }
  return resp;
}

async function errText(resp) {
  try { return (await resp.json()).error || resp.statusText; }
  catch { return resp.statusText; }
}

  setAuthMode('login');
}
function setAuthMode(m) {

  document.getElementById('tabLogin').classList.toggle('on', m === 'login');
  document.getElementById('tabReg').classList.toggle('on', m === 'reg');
  document.getElementById('codeRow').style.display = m === 'reg' ? '' : 'none';
  document.getElementById('aSubmit').textContent = m === 'reg' ? '注册并登录' : '登录';
}

document.getElementById('aSendCode').onclick = async () => {
  const email = document.getElementById('aEmail').value.trim();
  if (!email) { document.getElementById('aMsg').textContent = '先填邮箱'; return; }
  const btn = document.getElementById('aSendCode');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/auth/code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    if (!resp.ok) throw new Error(await errText(resp));
    const msg = document.getElementById('aMsg');
    msg.style.color = '#86efac';
    msg.textContent = '验证码已发送，10 分钟内有效';
    let left = 60;
    const timer = setInterval(() => {
      btn.textContent = left-- + 's';
      if (left < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
    }, 1000);
  } catch (e) {
    btn.disabled = false;
    document.getElementById('aMsg').style.color = '#fca5a5';
    document.getElementById('aMsg').textContent = e.message;
  }
};

document.getElementById('aSubmit').onclick = async () => {

// ---------- deck 列表：加载 / 刷新 / 选中 ----------
async function loadDecks() {
  try {
    const resp = await api('/api/decks');
    if (!resp.ok) return;
    const decks = await resp.json();
    const keep = deckSel.value;                       // 保留当前选择
    deckSel.innerHTML = '<option value="">（不指定）</option>';
    for (const d of decks) {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.id + ' · ' + d.title;
      deckSel.appendChild(opt);
    }
    if ([...deckSel.options].some(o => o.value === keep)) deckSel.value = keep;
    deckInfo.textContent = '共 ' + decks.length + ' 份';
  } catch (e) { if (e.message !== '未登录') { /* 静默：列表失败不影响对话 */ } }
}

function ensureDeckOption(id) {                       // 新建 deck 自动进下拉框
  if (![...deckSel.options].some(o => o.value === id)) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = id + ' · ' + id;
    deckSel.appendChild(opt);
  }
  deckSel.value = id;
}

// ---------- 版本历史：端到端测试版本控制（列表 / 恢复 / 删除 / 清空） ----------
// 记档时机是"一轮 run 结束"，所以列表在 done 事件、切换 deck、恢复之后刷新，
// 而不是每次写工具之后（run 中途还没记档，刷了也不会变）。
const histPanel = document.getElementById('histPanel');
const histList = document.getElementById('histList');
const histCount = document.getElementById('histCount');
const histMsg = document.getElementById('histMsg');
const histToggle = document.getElementById('histToggle');

function histSay(text, isErr) {
  histMsg.textContent = text || '';
  histMsg.style.color = isErr ? '#fca5a5' : '#86efac';
}

histToggle.onclick = () => {
  const open = histPanel.classList.toggle('open');
  histToggle.textContent = open ? '收起' : '展开';
  if (open) loadHistory();
};
document.getElementById('histReload').onclick = () => { histSay(''); loadHistory(); };

async function loadHistory() {
  const id = deckSel.value;
  if (!id) { histList.innerHTML = ''; histCount.textContent = '（未选 deck）'; return; }
  histCount.textContent = '加载中…';
  try {
    const resp = await api('/api/decks/' + id + '/history');
    if (!resp.ok) throw new Error(await errText(resp));
    const versions = await resp.json();
    renderHistory(versions || []);
    histCount.textContent = (versions ? versions.length : 0) + ' 条';
  } catch (e) {
    if (e.message === '未登录') return;
    histCount.textContent = '加载失败';
    histSay('历史加载失败：' + e.message, true);
  }
}

function renderHistory(versions) {
  histList.innerHTML = '';
  if (!versions.length) {
    const d = document.createElement('div');
    d.className = 'hist-row';
    const s = document.createElement('span');
    s.className = 't';
    s.textContent = '（还没有历史版本：跑一轮对话，run 结束后会自动记一条）';
    d.appendChild(s);
    histList.appendChild(d);
    return;
  }
  for (const v of versions) {
    const row = document.createElement('div');
    row.className = 'hist-row' + (v.operation === 'restore' ? ' restore-op' : '');

    const mk = (cls, text, title) => {
      const s = document.createElement('span');
      s.className = cls; s.textContent = text;
      if (title) s.title = title;
      return s;
    };
    const rBtn = document.createElement('button');
    rBtn.textContent = '恢复';
    rBtn.title = '恢复到这一版：立即重载预览。恢复动作本身也记一条历史，所以可以再撤销';
    rBtn.onclick = () => restoreVersion(v.version);

    const dBtn = document.createElement('button');
    dBtn.textContent = '删';
    dBtn.className = 'danger';
    dBtn.title = '删除这一条历史（快照互相独立，删中间不影响其他版本的恢复）';
    dBtn.onclick = () => deleteVersion(v.version);

    row.append(
      mk('v', v.version),
      mk('t', new Date(v.time * 1000).toLocaleString('zh-CN', { hour12: false })),
      mk('op', v.operation),
      mk('dt', v.detail || '', v.detail || ''),
      mk('pg', v.slides + '页'),
      rBtn, dBtn,
    );
    histList.appendChild(row);
  }
}

async function restoreVersion(version) {
  const id = deckSel.value;
  if (!id) return;
  if (!confirm('恢复到 ' + version + '？\n\nrestore 本身也会记一条新历史，所以这一步可以被再撤销。')) return;
  histSay('恢复中…');
  try {
    const resp = await api('/api/decks/' + id + '/history/' + version + '/restore', { method: 'POST' });
    if (!resp.ok) throw new Error(await errText(resp));
    histSay('✅ 已恢复到 ' + version + '（可再撤销）');
    loadPreview();          // 文件已换，重载沙箱预览
    loadHistory();
  } catch (e) {
    if (e.message === '未登录') return;
    histSay('恢复失败：' + e.message, true);
  }
}

async function deleteVersion(version) {
  const id = deckSel.value;
  if (!id) return;
  if (!confirm('删除历史 ' + version + '？\n\n只删这一条快照，不影响 deck 当前内容，也不影响其他版本恢复。')) return;
  histSay('删除中…');
  try {
    const resp = await api('/api/decks/' + id + '/history/' + version, { method: 'DELETE' });
    if (!resp.ok) throw new Error(await errText(resp));
    histSay('✅ 已删除 ' + version);
    loadHistory();
  } catch (e) {
    if (e.message === '未登录') return;
    histSay('删除失败：' + e.message, true);
  }
}

document.getElementById('histClear').onclick = async () => {
  const id = deckSel.value;
  if (!id) return;
  if (!confirm('清空 ' + id + ' 的全部历史？\n\ndeck 当前内容不受影响；版本编号不会复用（清空后从 v 序号继续）。')) return;

};

// ---------- SSE 消费：chat 与 answer 共用（EventSource 不支持 POST） ----------
async function consumeSSE(resp) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      handleFrame(buf.slice(0, idx));
      buf = buf.slice(idx + 2);
    }
  }
  if (buf.trim()) handleFrame(buf);
}

async function send() {
  const msg = input.value.trim();
  if (!msg || streaming || pendingAsk) return;   // pendingAsk：先回答提问，别白跑一次
  streaming = true;
  controller = new AbortController();
  sendBtn.disabled = true;
  abortBtn.style.display = '';
  bubble('user', msg);
  input.value = '';
  resetBubbles();

  try {
    const resp = await api('/api/chat', {
      method: 'POST',
      body: JSON.stringify({
        session_id: getSession() || undefined,
        user_content: msg,
        deck_id: deckSel.value || undefined,          // 选了才带，与后端 omitempty 对应
      }),
      signal: controller.signal,
    });
    if (!resp.ok) {
      bubble('syserr', 'HTTP ' + resp.status + '：' + await resp.text());
      return;
    }
    await consumeSSE(resp);
  } catch (e) {
    if (e.message === '未登录') return;
    if (e.name === 'AbortError') bubble('sys', '⏹ 已手动中断（服务端 agent 应随之取消）');
    else bubble('syserr', '连接错误：' + e.message);
  } finally {
    streaming = false;
    // 异常/中断路径的收尾：abort、网络断、HTTP 错误都不会发 done/error 事件。
    // 正常 done 已由 finishStream 定格（盒子已从 Map 删除），这里再调是空操作
    sealAll(' · 已中断');
    // 尊重待答状态：流里可能刚渲染了一张提问卡片（renderAskCard 会锁上它），
    // 这里无条件打开的话"提问待答时不能发新消息"就失效了
    sendBtn.disabled = pendingAsk;
    abortBtn.style.display = 'none';
  }
}

// 提交 ask_user 的回答：第二个 SSE 请求，恢复被暂停的循环
async function sendAnswer(answers, note) {
  if (streaming) return;
  streaming = true;
  controller = new AbortController();
  sendBtn.disabled = true;
  abortBtn.style.display = '';
  resetBubbles();
  try {
    const resp = await api('/api/chat/answer', {
      method: 'POST',
      body: JSON.stringify({ session_id: getSession(), answers, note }),
      signal: controller.signal,
    });
    if (!resp.ok) {
      bubble('syserr', 'HTTP ' + resp.status + '：' + await resp.text());
      return;
    }
    await consumeSSE(resp);
  } catch (e) {
    if (e.message === '未登录') return;
    if (e.name === 'AbortError') bubble('sys', '⏹ 已手动中断');
    else bubble('syserr', '连接错误：' + e.message);
  } finally {
    streaming = false;
    // 异常/中断路径的收尾：abort、网络断、HTTP 错误都不会发 done/error 事件。
    // 正常 done 已由 finishStream 定格（盒子已从 Map 删除），这里再调是空操作
    sealAll(' · 已中断');
    // 尊重待答状态：流里可能刚渲染了一张提问卡片（renderAskCard 会锁上它），
    // 这里无条件打开的话"提问待答时不能发新消息"就失效了
    sendBtn.disabled = pendingAsk;
    abortBtn.style.display = 'none';
  }
}

function handleFrame(frame) {
  if (rawChk.checked) onRaw(frame);   // 原始帧也走缓冲，高速流下不会每帧建节点
  let type = 'message', data = null;
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) type = line.slice(6).trim();
    else if (line.startsWith('data:')) data = line.slice(5).trim();
  }
  if (data === null) return;
  let ev;
  try { ev = JSON.parse(data); } catch { bubble('syserr', 'JSON 解析失败：' + data); return; }

  switch (type) {
    case 'delta':
      onDelta(ev.content ?? '');     // 只入缓冲，由 rAF 合并写入
      break;
    case 'think':
      onThink(ev.content ?? '');     // 同上；折叠显示，正文不参与布局
      break;
    case 'tool_start':
      onToolStart(ev);               // 主模型开始生成某次工具调用的参数
      break;
    case 'tool_delta':
      onToolDelta(ev);               // arguments 的 JSON 原文片段：盒子只透传计数，不解析
      break;
    case 'sub_delta':
      onSubDelta(ev);                // 工具执行期子模型（视觉审查）的报告原文，展开直读
      break;
    case 'session': {
      const id = parseInt(ev.content, 10) || 0;
      if (id > 0) {
        setSession(id);
        sessTag.textContent = '会话 #' + id;
      }
      // 收到 session 事件 = 服务端**已经接受**了这次请求并开始跑循环。
      // 这是"暂停态已解除"的可靠信号：后端在闸门之后才发这个事件
      //（见 NewStreamChat：先 guardNewMessage，再 persist，最后 emit session）。
      setPendingAsk(false);
      break;
    }
    case 'ask_user': {
      // 提问参数的流式盒定格收起，问题本身由下面的卡片重新展示；
      // 同轮被提问打断的其它工具不会再有结果事件，一并收尾
      sealAll(' · 等待回答');
      let qs = [];
      try { qs = JSON.parse(ev.content).questions || []; } catch { /* 参数非法时后端已拦截，这里兜底 */ }
      renderAskCard(qs);
      break;
    }
    case 'tool_call': {
      // 后端补了 tool_call_id 后按 id 精确归属；没带就按名字兜底
      sealBoxes(stream.tools, ev.tool_name ?? '', ' · 完成', ev.tool_call_id);
      sealBoxes(stream.subs, ev.tool_name ?? '', ' · 完成', ev.tool_call_id);   // 子模型输出盒一并收起
      const b = bubble('tool', '🛠 调用工具 ' + (ev.tool_name ?? ''));
      b.appendChild(pre(ev.content));
      // write_deck 成功 → 新 deck 自动进下拉框并选中，右侧预览跟着加载
      if (ev.tool_name === 'write_deck') {
        try {
          const r = JSON.parse(ev.content);
          if (r.deck_id) { ensureDeckOption(r.deck_id); loadDecks(); loadPreview(); }
        } catch { /* 忽略非 JSON 的工具结果 */ }
      }
      // update_slide 成功 → 文件已落盘，刷新预览看效果
      if (ev.tool_name === 'update_slide') loadPreview();
      // insert/delete 改变页数与页序，同样刷新
      if (ev.tool_name === 'insert_slide' || ev.tool_name === 'delete_slide') loadPreview();
      break;
    }
    case 'tool_error':
      sealBoxes(stream.tools, ev.tool_name ?? '', ' · 失败', ev.tool_call_id);
      sealBoxes(stream.subs, ev.tool_name ?? '', ' · 失败', ev.tool_call_id);
      bubble('toolerr', '⚠️ 工具失败 ' + (ev.tool_name ?? '')).appendChild(pre(ev.content));
      break;
    case 'trace':
      // 观测事件：agent 的执行过程。**默认不显示**（勾选框控制）——
      // 它比对话本身吵得多（每一轮的请求/回复/用量都各是一条），
      // 而完整记录本来就在 /trace 页面里，这里只是给个"顺手看一眼"的入口。
      if (traceChk.checked) bubble('trace', onTrace(ev.content));
      break;
    case 'done': {
      finishStream();                // 写尽缓冲 + 把思考标题切成"已思考"
      bubble('done', `✅ 完成 · prompt=${ev.prompt_tokens ?? '-'} · completion=${ev.completion_tokens ?? '-'} · total=${ev.total_tokens ?? '-'} · cached=${ev.cached_tokens ?? '-'}`);
      // 分项用量。上面那四个扁平数字是**主循环口径**（保持不变以免打破旧契约），
      // 而视觉审查（每次要塞好几张图）和联网搜索（按搜索次数计费）是分开计费的
      // 另外几次调用，它们的用量过去完全没被计入——所以真实成本要看这一行。
      const u = ev.usage;
      if (u && u.usage && Object.keys(u.usage).length) {
        const name = { main: '主循环', vision: '视觉审查', web_search: '联网搜索' };
        const parts = Object.keys(u.usage).sort().map(k => {
          const p = u.usage[k];
          return `${name[k] || k}=${p.total}(${p.calls}次${p.image_tokens ? '·图' + p.image_tokens : ''})`;
        });
        bubble('done', `📊 分项 token · ${parts.join(' · ')} · 合计=${(u.total || {}).total ?? '-'}`);
      }
      // run 结束 = 记档时刻（成功或 ask_user 暂停都会记），刷新历史列表
      loadHistory();
      break;
    }
    case 'error':
      bubble('syserr', '❌ ' + (ev.content ?? '未知错误'));
      // 被闸门拦下的那种：前端和服务器状态不同步了（例如卡片重建时那次请求失败）。
      // 去把卡片找回来并锁上输入框，否则用户会一直重复一个注定失败的点击。
      if ((ev.content ?? '').includes('提问还没有回答')) {
        restorePendingAsk(getSession());
      }
      break;
    default:
      bubble('sys', '未知事件类型 ' + type);
  }
}

// onTrace 把一条观测事件压成一行人读的摘要。
// 它只做摘要，不做完整渲染：完整视图在 /trace（那里能展开上下文、看截图、按页对量测）。
function onTrace(content) {
  let e;
  try { e = JSON.parse(content); } catch { return 'trace: ' + content; }
  const turn = e.turn != null ? `[第${e.turn + 1}轮] ` : '';
  switch (e.kind) {
    case 'llm_request':
      return `📤 ${turn}发给模型 ${e.message_count ?? '?'} 条消息（${fmtB(e.bytes)}）`;
    case 'llm_response': {
      const n = (e.tool_calls || []).length;
      const tok = e.usage ? ` · ${e.usage.total} tok` : '';
      return `📥 ${turn}模型回复${n ? '，想调用 ' + n + ' 个工具' : ''}${tok}`;
    }
    case 'tool_call':
      return `🛠 ${turn}${e.tool_name} 参数 ${clipS(e.args, 200)}`;
    case 'tool_result':
      return `${e.error ? '⚠️' : '✅'} ${turn}${e.tool_name} 返回（${e.duration_ms ?? '?'}ms）` +
        (e.error ? ` 失败：${clipS(e.error, 160)}` : ` ${clipS(e.result, 200)}`);
    case 'sub_step': {
      const s = e.sub || {};
      const d = s.data || {};
      if (s.name === 'web_search' && s.stage === 'request') return `🔎 ${turn}联网搜索：${clipS(s.text, 160)}`;
      if (s.name === 'web_search' && s.stage === 'queries')
        return `🔎 ${turn}实际搜了 ${(d.queries || []).map(q => `「${q}」`).join(' ')}（计费 ${d.searches ?? 0} 次，返回 ${d.source_n ?? 0} 条来源）`;
      if (s.name === 'vision' && s.stage === 'capture')
        return `📸 ${turn}视觉审查实拍 ${(d.pages || []).length} 页（第 ${d.round ?? 1} 次），截图见观测台`;
      if (s.name === 'vision' && s.stage === 'review_prompt') return `📸 ${turn}把 ${d.images ?? 0} 张截图发给审查模型`;
      if (s.name === 'vision' && s.stage === 'review_response') return `📸 ${turn}审查报告：${clipS(s.text, 240)}`;
      if (s.stage === 'error' || s.stage === 'review_error') return `⚠️ ${turn}${s.name} ${s.stage}：${clipS(s.text, 200)}`;
      return `• ${turn}${s.name}/${s.stage} ${clipS(s.text || JSON.stringify(d), 160)}`;
    }
    case 'usage': {
      const p = e.usage || {};
      const name = { main: '主循环', vision: '视觉审查', web_search: '联网搜索' };
      return `📊 ${turn}${name[e.component] || e.component} 本次 ${p.total} tok` +
        (p.reasoning ? `（推理 ${p.reasoning}）` : '') + (p.image_tokens ? `（图片 ${p.image_tokens}）` : '');
    }
    case 'error':
      return `❌ ${turn}${e.error}`;
    case 'run_end':
      return `🏁 ${turn}run 结束：${e.status}（总 token ${((e.summary || {}).total || {}).total ?? '-'}）`;
    default:
      return `• ${turn}${e.kind}`;
  }
}
const fmtB = n => n == null ? '?' : n < 1024 ? n + 'B' : n < 1048576 ? (n / 1024).toFixed(1) + 'KB' : (n / 1048576).toFixed(1) + 'MB';
const clipS = (s, n) => { s = String(s == null ? '' : s).replace(/\s+/g, ' '); return s.length <= n ? s : s.slice(0, n) + '…'; };

// ask_user 卡片：逐题渲染。契约：options 第一个 = 推荐答案（点击填入输入框）
function renderAskCard(qs) {
  setPendingAsk(true);   // 锁住输入框：此时发新消息会被后端闸门拦下
  const card = bubble('ask', `❓ Agent 想确认（${qs.length} 个问题）：`);
  const inputs = [];

  qs.forEach((q, i) => {
    const box = document.createElement('div');
    box.className = 'q';

    const label = document.createElement('div');
    label.textContent = (i + 1) + '. ' + (q.question || '');
    box.appendChild(label);

    const opts = q.options || [];
    if (opts.length > 0) {
      const rec = document.createElement('div');
      rec.className = 'rec';
      rec.textContent = '推荐：' + opts[0];
      box.appendChild(rec);
      const group = document.createElement('div');
      group.className = 'opts';
      opts.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o;
        b.onclick = () => { inputs[i].value = o; };
        group.appendChild(b);
      });
      box.appendChild(group);
    }

    const inp = document.createElement('input');
    inp.placeholder = '你的回答（留空 = 本题跳过）';
    box.appendChild(inp);
    inputs.push(inp);
    card.appendChild(box);
  });

  const acts = document.createElement('div');
  acts.className = 'acts';

  const submit = document.createElement('button');
  submit.className = 'submit';
  submit.textContent = '提交回答';
  submit.onclick = async () => {
    if (streaming) return;
    submit.disabled = true;
    const answers = qs.map((q, i) => ({ question: q.question || '', answer: inputs[i].value.trim() }))
                      .filter(a => a.answer !== '');
    inputs.forEach(i => i.disabled = true);
    card.querySelectorAll('.opts button').forEach(b => b.disabled = true);
    await sendAnswer(answers, '');
  };

  const skip = document.createElement('button');
  skip.className = 'skip';
  skip.textContent = '跳过（让 Agent 用推荐答案）';
  skip.onclick = async () => {
    if (streaming) return;
    skip.disabled = true;
    inputs.forEach(i => i.disabled = true);
    card.querySelectorAll('.opts button').forEach(b => b.disabled = true);
    // 全跳过 → answers 为空 → 后端走 note 通道，note 提示用推荐答案
    await sendAnswer([], '');
  };

  acts.appendChild(submit);
  acts.appendChild(skip);
  card.appendChild(acts);
  scroll();
}

function pre(text) {
  const p = document.createElement('pre');
  p.textContent = text ?? '';
  return p;
}

// ---------- 事件绑定 ----------
sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) send();
});
abortBtn.onclick = () => controller?.abort();

// ---------- 启动：有 token 则进入工作台，否则弹登录 ----------
async function init() {
  await refreshWho();
  await loadDecks();
  loadPreview();
  loadHistory();          // 顶部就能看到已有多少版本，不用先展开面板
  const sid = getSession();
  if (sid > 0) {
    sessTag.textContent = '会话 #' + sid;
    await restorePendingAsk(sid);   // 刷新后把丢掉的提问卡片找回来
  }
}
(async () => {
  if (!getToken()) { showAuth(''); return; }
  try {
    await init();
    bubble('sys', '就绪。对话按会话持久化（右上角"新对话"开新会话）；ask_user 卡片出现时直接在卡片里回答。');
  } catch { /* 401 已由 api() 弹回登录 */ }
})();
</script>
